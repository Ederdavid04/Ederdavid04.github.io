<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE PLINTH | Login</title>

    <!-- Bootstrap (solo grid) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --navy: #0a1a2f;
        --navy-dark: #071425;
        --red: #d32f2f;
        --white: #ffffff;
        --gray: #9aa4b2;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--navy-dark);
        height: 100vh;
      }

      /* LAYOUT */
      .login-layout {
        height: 100vh;
      }

      /* LEFT PANEL */
      .left-panel {
        position: relative;
        background: linear-gradient(
            to bottom,
            rgba(10, 26, 47, 0.6),
            rgba(7, 20, 37, 0.95)
          ),
          url("./img/model3.png");
        background-size: cover;
        background-position: center;
        padding: 80px;
        color: var(--white);
      }

      .left-panel::after {
        content: "";
        position: absolute;
        right: 0;
        top: 8%;
        height: 84%;
        width: 2px;
        background: var(--border);
      }

      .brand {
        font-size: 3.4rem;
        font-weight: 800;
        letter-spacing: 6px;
      }

      .brand span {
        color: var(--red);
      }

      .left-line {
        width: 90px;
        height: 4px;
        background: var(--red);
        margin: 30px 0;
      }

      .left-panel p {
        max-width: 420px;
        line-height: 1.7;
        color: #d2d9e4;
      }

      /* RIGHT PANEL */
      .right-panel {
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-box {
        width: 100%;
        max-width: 420px;
      }

      .login-header {
        margin-bottom: 40px;
      }

      .login-header h2 {
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--navy);
        margin-bottom: 8px;
      }

      .login-header small {
        color: #6b7280;
      }

      /* INPUTS CUSTOM */
      .field {
        margin-bottom: 22px;
      }

      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--navy);
        margin-bottom: 8px;
      }

      .field input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: 0.3s;
      }

      .field input:focus {
        border-color: var(--navy);
      }

      /* BUTTON */
      .btn-login {
        width: 100%;
        padding: 15px;
        background: var(--navy);
        color: var(--white);
        font-weight: 700;
        letter-spacing: 1px;
        border: none;
        border-radius: 8px;
        transition: 0.3s;
      }

      .btn-login:hover {
        background: #102c4d;
      }

      /* FOOTER LINKS */
      .login-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
      }

      .login-footer a {
        text-decoration: none;
        font-weight: 600;
        color: var(--red);
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 991px) {
        .left-panel {
          display: none;
        }
        .right-panel {
          padding: 40px 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container-fluid login-layout">
      <div class="row h-100">
        <!-- LEFT -->
        <div
          class="col-lg-6 left-panel d-none d-lg-flex flex-column justify-content-center"
        >
          <div>
            <div class="brand">THE <span>PLINTH</span></div>
            <div class="left-line"></div>
            <p>
              Accede a tu cuenta oficial para gestionar pedidos, lanzamientos
              exclusivos y tu experiencia dentro de la marca.
            </p>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-6 right-panel">
          <div class="login-box">
            <div class="login-header">
              <h2>INICIAR SESIÓN</h2>
              <small>Introduce tus credenciales</small>
            </div>

            <form id="loginForm">
              <div class="field">
                <label>CORREO ELECTRÓNICO</label>
                <input type="email" required />
              </div>

              <div class="field">
                <label>CONTRASEÑA</label>
                <input type="password" required />
              </div>

              <button class="btn-login">ACCEDER</button>
            </form>

            <div class="login-footer">
              <a href="#">Crear cuenta</a>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          localStorage.setItem("user", "true");
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
