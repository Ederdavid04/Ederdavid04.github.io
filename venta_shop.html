<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE PLINTH | Producto</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <style>
      body {
        background: #0f0f0f;
        color: #fff;
      }
      .product-image {
        border-radius: 20px;
        width: 100%;
        object-fit: cover;
      }
      .size-btn,
      .color-btn {
        border: 1px solid #555;
        background: transparent;
        color: #fff;
        padding: 8px 14px;
        margin-right: 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .size-btn.active,
      .color-btn.active {
        background: #fff;
        color: #000;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <a href="index.html#shop" class="text-white text-decoration-none">
        ← Volver a la tienda
      </a>

      <div class="row mt-4 align-items-center">
        <!-- Imagen -->
        <div class="col-md-6">
          <img id="product-image" class="product-image" />
        </div>

        <!-- Info -->
        <div class="col-md-6">
          <h1 id="product-name"></h1>
          <p id="product-description" class="text-secondary"></p>
          <h3 class="my-3">$<span id="product-price"></span></h3>

          <!-- Tallas -->
          <h6>Talla</h6>
          <div id="sizes"></div>

          <!-- Colores -->
          <h6 class="mt-3">Color</h6>
          <div id="colors"></div>

          <!-- Acciones -->
          <div class="mt-4 d-flex gap-3">
            <button class="btn btn-light btn-lg" onclick="buyNow()">
              Comprar ahora
            </button>
            <button class="btn btn-outline-light btn-lg" onclick="addToCart()">
              Añadir al carrito
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const products = [
        {
          id: 1,
          name: "Playera Minimal Oversize",
          description: "Algodón premium oversize",
          price: 499,
          sizes: ["S", "M", "L"],
          colors: ["#000000", "#ffffff"],
          image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
        },
        {
          id: 2,
          name: "Camiseta Essential",
          description: "Básica esencial",
          price: 399,
          sizes: ["S", "M", "L"],
          colors: ["#ffffff"],
          image: "https://images.unsplash.com/photo-1523381210434-271e8be1f52b",
        },
      ];

      const params = new URLSearchParams(window.location.search);
      const productId = parseInt(params.get("id"));
      const product = products.find((p) => p.id === productId);

      if (!product) {
        document.body.innerHTML =
          "<h2 class='text-center mt-5'>Producto no encontrado</h2>";
      } else {
        document.getElementById("product-image").src = product.image;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("product-description").textContent =
          product.description;
        document.getElementById("product-price").textContent = product.price;

        let selectedSize = null;
        let selectedColor = null;

        const sizeContainer = document.getElementById("sizes");
        product.sizes.forEach((size) => {
          const btn = document.createElement("button");
          btn.textContent = size;
          btn.className = "size-btn";
          btn.onclick = () => {
            document
              .querySelectorAll(".size-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            selectedSize = size;
          };
          sizeContainer.appendChild(btn);
        });

        const colorContainer = document.getElementById("colors");
        product.colors.forEach((color) => {
          const btn = document.createElement("button");
          btn.className = "color-btn";
          btn.style.background = color;
          btn.onclick = () => {
            document
              .querySelectorAll(".color-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            selectedColor = color;
          };
          colorContainer.appendChild(btn);
        });

        window.addToCart = () => {
          if (!selectedSize || !selectedColor) {
            alert("Selecciona talla y color");
            return;
          }

          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          cart.push({ ...product, selectedSize, selectedColor, qty: 1 });
          localStorage.setItem("cart", JSON.stringify(cart));
          alert("Producto añadido al carrito");
        };

        window.buyNow = () => {
          addToCart();
          window.location.href = "checkout.html";
        };
      }
    </script>
  </body>
</html>
